name: Record screenshots (temporary)
on:
  push:
    branches: [ci-screens-tmp]
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[recorded]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/visual.spec.ts --update-snapshots
        env:
          CI: 'true'
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add e2e/__screenshots__/ci
          git commit -m "Recorded CI screenshots [recorded]" || echo nothing
          git push origin HEAD:ci-screens-tmp
