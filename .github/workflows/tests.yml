name: Tests

# Every push and every pull request runs the same checks that must pass before a deploy.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      update_screenshots:
        description: Record the screenshot baselines on GitHub's runner (download screenshots-ci)
        type: boolean
        default: false

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint and types
        run: npm run lint
      - name: Formatting
        run: npm run format:check
      - name: Server unit tests
        run: npm run test:unit
      - name: Security audit (shipped packages)
        run: npm audit --omit=dev --audit-level=high
      - name: Build
        run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      # Run by hand with "update screenshots": records the screenshots on GitHub's runner and
      # offers them as the screenshots-ci download, to be looked at and committed by a person.
      - name: Record screenshot baselines
        if: ${{ inputs.update_screenshots }}
        run: npx playwright test e2e/visual.spec.ts --update-snapshots
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.update_screenshots }}
        with:
          name: screenshots-ci
          path: e2e/__screenshots__/ci/
      - name: End-to-end, accessibility and screenshot tests
        if: ${{ !inputs.update_screenshots }}
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
