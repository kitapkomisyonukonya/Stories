<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://firebasestorage.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://storage.googleapis.com" crossorigin />
    <link rel="icon" type="image/png" href="/icons/logo-favicon-64.png" />
    <link rel="apple-touch-icon" href="/icons/logo-apple-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0b0e0c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="From Language to Culture" />
    <title>From Language to Culture</title>
    <meta name="description" content="From Language to Culture (Lisandan Kültüre): an English and Arabic interactive story library at A2, B1 and B2 levels, with audio, activities and teacher materials." />
    <style>
      /* Shown until the app starts: the same branded screen the app shows while a book loads. */
      #boot-screen { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 18% 18%, rgba(194, 170, 107, 0.18), transparent 30%), radial-gradient(circle at 82% 78%, rgba(194, 170, 107, 0.12), transparent 34%), linear-gradient(145deg, #14221a 0%, #192b20 52%, #101b15 100%); }
      #boot-screen svg { width: 32px; height: 32px; animation: boot-spin 0.9s linear infinite; filter: drop-shadow(0 0 14px rgba(194, 170, 107, 0.22)); }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { #boot-screen svg { animation-duration: 2.5s; } }
    </style>
  </head>
  <body>
    <div id="root"><div id="boot-screen" role="status" aria-label="Loading"><svg viewBox="0 0 24 24" fill="none" stroke="#c2aa6b" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.219-8.56" /></svg></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
